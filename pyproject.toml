[project]
name = "jarvis"
version = "5.0.0"
description = "Cross-Platform AI Assistant with Cybersecurity & Web Dashboard"
requires-python = ">=3.10"
dependencies = [
    "pyrefly>=0.60.0",
]

[tool.black]
line-length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = ["venv", "__pycache__"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
